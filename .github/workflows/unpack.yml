name: Unpack project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into the repository root
        run: |
          set -e
          test -f ShepherdAI.zip
          mkdir "$RUNNER_TEMP/x"
          unzip -q ShepherdAI.zip -d "$RUNNER_TEMP/x"
          rm -rf "$RUNNER_TEMP/x/ShepherdAI/.github"
          cp -a "$RUNNER_TEMP/x/ShepherdAI/." .
          rm ShepherdAI.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack ShepherdAI project" || echo "nothing to commit"
          git push
