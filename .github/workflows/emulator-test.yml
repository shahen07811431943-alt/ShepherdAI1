name: Emulator test ShepherdAI
on:
  push:
  workflow_dispatch:
jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Fetch models
        run: bash scripts/fetch_models.sh
      - name: Fetch real sheep / goat / other photos
        run: bash scripts/fetch_test_images.sh
      - name: Build app + test APKs
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/run_emulator_tests.sh
      - name: Show results in the run summary
        if: always()
        run: |
          for f in ci-report/detection_report.md ci-report/reid_report.md; do
            [ -f "$f" ] && { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-report
          path: ci-report/
